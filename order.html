<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оформити замовлення | Andromeda Garden</title>

  <!-- Підключення Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Ваші стилі -->
  <link rel="stylesheet" href="styles/order.css">
</head>
<body>

  <!-- ХЕДЕР -->
  <header>
    <div class="logo-title">
      <img src="images/logo.png" alt="Andromeda Logo" class="logo">
      <h1>Andromeda Garden</h1>
    </div>
  </header>

  <main>
    <section class="order-section">
      <h2>Оформлення замовлення</h2>

      <!-- Розмір букету -->
      <div class="order-block">
        <h3>Оберіть розмір букету:</h3>
        <div class="option-buttons d-flex flex-wrap gap-3">
          <button class="btn btn-outline-success">Малий — 200 грн</button>
          <button class="btn btn-outline-success">Середній — 350 грн</button>
          <button class="btn btn-outline-success">Великий — 500 грн</button>
        </div>
      </div>

      <!-- Наповнення -->
      <div class="order-block">
        <h3>Оберіть квіти:</h3>
        <p class="note text-muted">До двох варіантів входить у вартість. Кожен додатковий — +50 грн.</p>
        <div class="flower-icons d-flex flex-wrap gap-3">
          <label><input type="checkbox"> Троянди</label>
          <label><input type="checkbox"> Тюльпани</label>
          <label><input type="checkbox"> Гербери</label>
          <label><input type="checkbox"> Орхідеї</label>
          <label><input type="checkbox"> Півонії</label>
          <label><input type="checkbox"> Ромашки</label>
          <label><input type="checkbox"> Дзвіночки</label>
          <label><input type="checkbox"> Жоржини</label>
          <label><input type="checkbox"> Стокротки</label>
          <label><input type="checkbox"> Чорнобривці</label>
          <label><input type="checkbox"> Нагідки</label>
          <label><input type="checkbox"> Лілії</label>
          <label><input type="checkbox"> Гіацинти</label>
        </div>
      </div>

      <!-- Інформація для доставки -->
      <div class="order-block">
        <h3>Доставка:</h3>
        <form class="delivery-form">
          <div class="mb-3">
            <input type="text" class="form-control" placeholder="Місто" required>
          </div>
          <div class="mb-3">
            <input type="text" class="form-control" placeholder="Вулиця, будинок, квартира" required>
          </div>
          <div class="mb-3">
            <input type="tel" class="form-control" placeholder="Номер телефону" required>
          </div>
          <div class="mb-3">
            <textarea class="form-control" rows="3" placeholder="Додаткові побажання"></textarea>
          </div>
          <button type="submit" class="btn btn-success">Оплатити і замовити</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="text-center mt-5 py-3 bg-light">
    <p>&copy; 2025 Andromeda Garden. Усі права захищені.</p>
  </footer>

</body>
</html>
